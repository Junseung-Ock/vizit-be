# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "ko-KR"
early_access: false
tone_instructions: |
  당신은 Vizit 백엔드 프로젝트의 코드 리뷰어입니다. 목표는 코드 품질을 개선하고 개발자가 성장하도록 돕는 것입니다.
  1. 피드백은 명확하고 구체적이어야 하며, 문제의 원인과 개선 방법을 반드시 제시하세요.
     1-1. 개선 방법은 가장 효율적인 방식을 제시하세요.
  2. 리뷰는 교육적이어야 하며, 단순히 문제를 지적하기보다 왜 문제인지 설명하세요.
  3. 비판보다는 개선 중심의 제안을 우선하세요.

reviews:
  profile: "assertive"
  request_changes_workflow: true
  high_level_summary: true
  review_status: true
  review_details: false
  poem: false
  auto_review:
    enabled: true
    drafts: false
  path_instructions:
    - path: "**/*"
      instructions: |
        모든 리뷰 코멘트는 반드시 아래 접두사 중 하나로 시작하세요.

        P1: 머지 전 반드시 수정해야 하는 blocking 이슈입니다. 정확성, 보안, 데이터 손실, 빌드/테스트 실패, 명확한 회귀처럼 병합 전에 해결해야 하는 문제에만 사용하세요.
        P2: 수정하면 좋지만 병합을 막지는 않는 non-blocking 이슈입니다. 유지보수성, 성능 개선, 엣지 케이스 보완, 테스트 보강 제안에 사용하세요.
        Q: 작성자에게 확인이 필요한 질문입니다. 코드 변경을 단정할 수 없고 의도나 요구사항 확인이 필요할 때만 사용하세요.
        Nit: 사소한 취향이나 스타일 제안입니다. 무시해도 되는 코멘트에만 사용하세요.

        P1 이슈가 있으면 request changes로 처리하고, P2/Q/Nit만 있으면 병합을 막지 마세요.

    - path: "src/main/java/**/*.java"
      instructions: |
        Spring Boot 4.0 / Java 17 / Hibernate 7 기준으로 리뷰하세요.
        아래 프로젝트 컨벤션을 기준으로 판단하세요.
        - Controller는 요청/응답 변환만. 비즈니스 로직 금지.
        - Service는 트랜잭션 단위. 다른 도메인 Service 직접 주입 금지.
        - Entity는 setter 금지. 정적 팩토리 메서드(of, create) 사용.
        - 모든 API 응답은 ApiResponse<T> 래퍼 사용.
        - ErrorCode enum으로 에러 관리 ({DOMAIN}_{DESCRIPTION} 형식).

chat:
  auto_reply: true

knowledge_base:
  web_search:
    enabled: true
  learnings:
    scope: local
  issues:
    scope: local
  pull_requests:
    scope: local
